name: Hassfest

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"  # a diario: avisa si HACS u Home Assistant cambian sus reglas
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
